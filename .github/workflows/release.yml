name: release

on:
  push:
    tags:
      - "v*"

# Least privilege: only what is needed to create a release.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and package
        shell: powershell
        run: ./tools/pack.ps1 -Version $env:GITHUB_REF_NAME

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
