; VoidSniffer settings - this file lives next to VoidSniffer.exe.
; Boolean options: 1 = on, 0 = off. Out-of-range values are clamped.

; Interface language: ru, en or any code from lang\<code>.lang.
; Empty = auto (command line > VOIDSNIFFER_LANG > this file > OS culture).
language=

; Use the Everything 1.5 pipe API (SDK3) when available (0/1).
; Leave 0 for Everything 1.4 or if the 1.5 beta pipe is unstable.
sdk3=0

; Maximum entries returned by one index query (>= 1000).
max_results=200000

; Nesting depth from the current folder, used for drawing and auto-expansion (1..8).
recursion_depth=4

; Show the volume's free space as a separate tile (0/1).
show_free_space=0

; Expand the largest subfolders in the background so nesting appears (0/1).
auto_expand=1
; Maximum number of folders auto-expanded per pass.
auto_expand_budget=300
; Time limit for one auto-expansion pass, seconds.
auto_expand_seconds=12

; Main window size and state.
window_width=960
window_height=620
window_maximized=0

; Last scanned root, prefilled on start (updated on exit).
last_path=C:\
